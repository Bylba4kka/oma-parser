x-env: &env
  path: .env
  required: false

x-app: &app
  image: oma-parser
  build: .
  restart: on-failure
  env_file:
    - *env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-oma}
    POSTGRES_USER: ${POSTGRES_USER:-oma}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oma}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_USER: ${REDIS_USER:-oma}
    REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD:-oma}
    SHARED_DIR: /app/shared
    PROXYS_IO_API_KEY: ${PROXYS_IO_API_KEY:-}
    PROXIES_FILE: /app/shared/proxies.txt
  volumes:
    # файловая шара: выгрузки Excel в shared/exports (+ запасной proxies.txt)
    - ./shared:/app/shared
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17
    container_name: db
    restart: on-failure
    # synchronous_commit=off: коммит не ждёт fsync (на macOS bind-mount это очень медленно);
    # при падении теряется максимум доля секунды — эти товары просто перепарсятся
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off"]
    env_file:
      - *env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-oma}
      POSTGRES_USER: ${POSTGRES_USER:-oma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oma}
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: redis_container
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-oma}
      - REDIS_USER=${REDIS_USER:-oma}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD:-oma}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $$REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $$REDIS_USER on >$$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    container_name: oma-api
    ports:
      - "127.0.0.1:8080:8080"
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8080"]

  worker:
    <<: *app
    container_name: oma-worker
    command: ["python", "-m", "app.worker"]
